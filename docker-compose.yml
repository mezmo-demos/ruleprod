# Local dev stack: Postgres (stand-in for the CNPG shopdb cluster), the four
# backends, the frontend, and an OTel collector that prints telemetry to its
# own stdout so the observability story is visible locally.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 2s
      timeout: 2s
      retries: 15

  otel-collector:
    # Dev-only; the cluster runs its own collector (gitops workloads/addons/otel-collector)
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel/config.yaml:ro

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment: &backend-env
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: shop
      DB_USER: shop
      DB_PASSWORD: shop
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CATALOG_URL: http://catalog:3000
      CART_URL: http://cart:3000
      CHECKOUT_URL: http://checkout:3000
      ORDERS_URL: http://orders:3000
    ports:
      - '4101:3000'
    depends_on:
      postgres:
        condition: service_healthy

  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    environment: *backend-env
    ports:
      - '4102:3000'
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started

  checkout:
    build:
      context: .
      dockerfile: services/checkout/Dockerfile
    environment: *backend-env
    ports:
      - '4103:3000'
    depends_on:
      - cart
      - orders

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment: *backend-env
    ports:
      - '4104:3000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    environment:
      CATALOG_URL: http://catalog:3000
      CART_URL: http://cart:3000
      CHECKOUT_URL: http://checkout:3000
      ORDERS_URL: http://orders:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SESSION_SECRET: dev-secret
    ports:
      - '3000:3000'
    depends_on:
      - catalog
      - cart
      - checkout
      - orders
