# Release loop (gitops docs/WEBSITE.md): build changed services on arm64,
# push git-SHA-tagged images to ECR via OIDC (no stored keys), then — once the
# verify job passes — open an image-tag bump PR against mezmo-demos/gitops.
# Merge = release, revert = rollback.
#
# Required repo configuration:
#   secrets.ECR_PUSH_ROLE_ARN      — OIDC push role (terramate-ruleprod ecr stack)
#   secrets.RELEASE_APP_CLIENT_ID   — GitHub App with Contents + Pull requests
#   secrets.RELEASE_APP_PRIVATE_KEY   write on mezmo-demos/gitops. Deliberately
#                                     not the argocd app: Argo CD only ever reads
#                                     manifests, so it stays read-only.
#                                     CLIENT_ID is the app's Client ID
#                                     ("Iv23li..."), not its numeric App ID —
#                                     create-github-app-token v3 deprecated
#                                     app-id in favour of client-id.
#   vars.ECR_REGISTRY              — <account>.dkr.ecr.<region>.amazonaws.com
#   vars.AWS_REGION                — defaults to us-east-1 when unset
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated service names, or "all"
        default: all

concurrency:
  group: build-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  # Same checks as ci.yml, which is PR-only. The PR run tests refs/pull/N/merge
  # — the merge preview at that moment — so if main moves before the merge, the
  # commit that actually lands here was never tested. This is that gate.
  #
  # It blocks `release`, not `build`: images are immutable and SHA-tagged, so
  # pushing one for a failing commit is harmless (nothing ever references it),
  # and running verify alongside the image matrix instead of before it keeps
  # release waiting on max(build, verify) rather than the sum.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  changes:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'package-lock.json'
              - 'tsconfig.base.json'
            frontend:
              - 'services/frontend/**'
            catalog:
              - 'services/catalog/**'
            cart:
              - 'services/cart/**'
            checkout:
              - 'services/checkout/**'
            orders:
              - 'services/orders/**'
            loadgen:
              - 'services/loadgen/**'
      - name: Resolve service list
        id: list
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.services }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
        run: |
          all=(frontend catalog cart checkout orders loadgen)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REQUESTED" = "all" ]; then svcs=("${all[@]}"); else read -ra svcs <<< "$REQUESTED"; fi
          elif [ "$SHARED_CHANGED" = "true" ]; then
            svcs=("${all[@]}")
          else
            svcs=()
            [ "${{ steps.filter.outputs.frontend }}" = "true" ] && svcs+=(frontend)
            [ "${{ steps.filter.outputs.catalog }}" = "true" ] && svcs+=(catalog)
            [ "${{ steps.filter.outputs.cart }}" = "true" ] && svcs+=(cart)
            [ "${{ steps.filter.outputs.checkout }}" = "true" ] && svcs+=(checkout)
            [ "${{ steps.filter.outputs.orders }}" = "true" ] && svcs+=(orders)
            [ "${{ steps.filter.outputs.loadgen }}" = "true" ] && svcs+=(loadgen)
          fi
          echo "services=$(jq -nc '$ARGS.positional' --args "${svcs[@]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    # Native arm64 (Graviton nodes); fall back to buildx + QEMU if the org
    # plan loses arm runners.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/ruleprod/${{ matrix.service }}:${{ github.sha }}
        run: |
          docker build -f "services/${{ matrix.service }}/Dockerfile" -t "$IMAGE" .
          docker push "$IMAGE"

  release:
    needs: [changes, build, verify]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: mezmo-demos
          repositories: gitops
      - uses: actions/checkout@v5
        with:
          repository: mezmo-demos/gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
      - name: Bump image tags
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          for svc in $(jq -r '.[]' <<< "$SERVICES"); do
            manifest="gitops/workloads/services/${svc}/deployment.yaml"
            # A service can merge before its gitops manifest exists (bootstrap
            # order): the image is pushed and waits; nothing to bump yet.
            if [ ! -f "$manifest" ]; then
              echo "::warning::no gitops manifest for ${svc}; skipping tag bump"
              continue
            fi
            yq -i ".spec.template.spec.containers[0].image = \"${REGISTRY}/ruleprod/${svc}:${GITHUB_SHA}\"" \
              "$manifest"
          done
      - name: Open bump PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: gitops
          token: ${{ steps.app-token.outputs.token }}
          branch: release/${{ github.sha }}
          commit-message: |
            chore: bump ${{ join(fromJSON(needs.changes.outputs.services), ', ') }} to ${{ github.sha }}
          title: "release: ${{ join(fromJSON(needs.changes.outputs.services), ', ') }} @ ${{ github.sha }}"
          body: |
            ## Summary
            - Image tag bump from [mezmo-demos/ruleprod@${{ github.sha }}](https://github.com/mezmo-demos/ruleprod/commit/${{ github.sha }})
            - Services: ${{ join(fromJSON(needs.changes.outputs.services), ', ') }}
