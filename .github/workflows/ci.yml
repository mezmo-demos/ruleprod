name: ci

# PR-only. On main the same checks run as build.yml's `verify` job, where they
# gate the release PR — a second copy here would just duplicate the run.
on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
